<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - API Logs</title>
  <link rel="stylesheet" href="/styles/tailwind.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">
  <!-- Sidebar (Desktop) -->
  <aside class="sidebar">
    <div class="h-16 flex items-center justify-center border-b border-slate-700 text-xl font-bold">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
        </div>
        <span>API Logs</span>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="/logs/home" class="nav-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5a2 2 0 012-2h4a2 2 0 012 2v2H8V5z"></path>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="/logs" class="nav-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span>Logs</span>
      </a>
      <a href="/logs/settings" class="nav-link active">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  <!-- Mobile Header -->
  <header class="md:hidden w-full bg-slate-900 border-b border-slate-700 text-slate-100 p-4 flex justify-between items-center">
    <span class="text-lg font-bold">API Logs</span>
    <button class="text-slate-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-6 overflow-auto">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-3xl font-bold text-white">Settings</h1>
          <p class="text-slate-400 mt-2">Manage your API Logger configuration and users</p>
        </div>
        <button id="logout-btn" class=" bg-red-600 hover:bg-red-700 flex px-4 py-3 rounded-lg">
          <svg class="w-8 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          <span>Logout</span>
        </button>
      </div>

      <!-- User Management Section -->
      <div id="user-management-section" class="card mb-8 p-4">
        <div class="flex items-center space-x-3 mb-6">
          <div class="w-10 h-10 bg-gradient-to-br from-green-500/20 to-emerald-500/20 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
            </svg>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-white">User Management</h3>
            <p class="text-sm text-slate-400">Add and manage system users</p>
          </div>
        </div>

        <!-- Add User Form -->
        <div class="bg-slate-800/50 rounded-lg p-8 mb-8">
          <h4 class="text-lg font-semibold text-white mb-6">Add New User</h4>
          <form id="add-user-form" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="user-email" class="block text-sm font-medium text-slate-300 mb-3">Email</label>
                <input type="email" id="user-email" name="email" required 
                       class="input-modern" placeholder="user@example.com">
              </div>
              <div>
                <label for="user-password" class="block text-sm font-medium text-slate-300 mb-3">Password</label>
                <input type="password" id="user-password" name="password" required 
                       class="input-modern" placeholder="Enter password">
              </div>
            </div>
            <div class="flex justify-end pt-4">
              <button type="submit" class="btn-primary flex px-6 py-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                <span>Add User</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Users List -->
        <div class="pt-6">
          <div class="flex items-center justify-between mb-6">
            <h4 class="text-lg font-semibold text-white">Current Users</h4>
            <button id="refresh-users" class="btn-primary flex justify-between gap-x-2 py-2 items-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              <span>Refresh</span>
            </button>
          </div>
          <div id="users-list" class="space-y-4">
            <!-- Users will be loaded here -->
            <div class="text-center py-12">
              <div class="loading-pulse h-4 w-32 mx-auto mb-3"></div>
              <div class="loading-pulse h-4 w-24 mx-auto mb-3"></div>
              <div class="loading-pulse h-4 w-28 mx-auto"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- System Information -->
      <div class="card">
        <div class="flex items-center space-x-3 mb-6">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-500/20 to-purple-500/20 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-white">System Information</h3>
            <p class="text-sm text-slate-400">API Logger system details</p>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-slate-800/50 rounded-lg p-6">
            <h4 class="text-sm font-medium text-slate-300 mb-3">Version</h4>
            <p class="text-lg font-semibold text-white">2.0.0</p>
          </div>
          <div class="bg-slate-800/50 rounded-lg p-6">
            <h4 class="text-sm font-medium text-slate-300 mb-3">Framework</h4>
            <p class="text-lg font-semibold text-white">Node.js + Express</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/settings.js"></script>
</body>
</html>
